version: 2

project_name: autox

before:
  hooks:
    - go mod tidy

builds:
  - id: autox
    main: ./cmd/autox/main.go
    binary: autox
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ivis-kuroda/weko-autox/internal/cli.versionString={{ .Version }}
      - -X github.com/ivis-kuroda/weko-autox/internal/cli.commitString={{ .ShortCommit }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"

changelog:
  use: git
  sort: asc
