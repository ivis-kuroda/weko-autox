name: Tag Release On Main Merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: tag-on-merge
  cancel-in-progress: false

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Derive version from merged release branch
        id: version
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          head_ref="$HEAD_REF"
          if [[ "$head_ref" =~ ^release/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "This workflow expects PR head branch name release/<semver>."
            echo "PR head ref: $head_ref"
            exit 1
          fi

          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Skipping to avoid duplication."
            exit 1
          fi

      - name: Write release notes from PR description
        id: notes
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp /tmp/release-notes.XXXXXX.md)"
          if [[ -n "${PR_BODY}" ]]; then
            printf '%s\n' "${PR_BODY}" > "$notes_file"
          else
            printf 'No PR description was provided.\n' > "$notes_file"
          fi

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          # created before the tag is pushed, so that the tag-triggered release
          # workflow always finds this draft already in place (see below) -
          # a draft release does not require the tag to exist yet
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "$tag" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --draft

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # pushed last: this is what triggers release.yml, and by this point
          # the draft release above is already guaranteed to exist, so there
          # is no race between the two workflows
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
